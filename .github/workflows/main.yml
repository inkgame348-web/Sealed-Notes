name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/sealednotes.keystore
          ls -la keystore/

      - name: Create keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_VALUE: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_VALUE: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=keystore/sealednotes.keystore
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS_VALUE}
          keyPassword=${KEY_PASSWORD_VALUE}
          EOF

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Release
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Get version
        id: v
        run: |
          VERSION=$(grep 'versionName' app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected: $VERSION"

      - name: Prepare output
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk "output/SealedNotes-${{ steps.v.outputs.version }}.apk"
          ls -la output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SealedNotes-${{ steps.v.outputs.version }}
          path: output/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        run: |
          rm -f keystore.properties
          rm -rf keystore
