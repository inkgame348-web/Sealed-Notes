name: Build Sealed Notes Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: Find Gradle project root
        id: find
        run: |
          echo "=== Структура репозитория ==="
          find . -maxdepth 3 -name "settings.gradle*" -not -path "*/node_modules/*"
          echo "=============================="
          FOUND=$(find . -maxdepth 3 -name "settings.gradle" -o -maxdepth 3 -name "settings.gradle.kts" | head -1)
          if [ -z "$FOUND" ]; then
            echo "::error::Не найден settings.gradle во всём репозитории"
            exit 1
          fi
          DIR=$(dirname "$FOUND" | sed 's|^\./||')
          if [ -z "$DIR" ] || [ "$DIR" = "." ]; then DIR="."; fi
          echo "Found settings.gradle in: $DIR"
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Check secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 не задан"
            exit 1
          fi
          echo "Secrets OK"

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/sealednotes.keystore
          ls -la keystore/

      - name: Create keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_VALUE: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_VALUE: ${{ secrets.KEY_PASSWORD }}
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=keystore/sealednotes.keystore
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS_VALUE}
          keyPassword=${KEY_PASSWORD_VALUE}
          EOF

      - name: Build Release APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Get version
        id: v
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          VERSION=$(grep 'versionName' app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$VERSION" ]; then VERSION="unknown"; fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Prepare output
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk \
             "output/SealedNotes-${{ steps.v.outputs.version }}.apk"
          ls -la output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SealedNotes-${{ steps.v.outputs.version }}
          path: ${{ steps.find.outputs.dir }}/output/*.apk
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find.outputs.dir }}/output/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          rm -f keystore.properties
          rm -rf keystore
